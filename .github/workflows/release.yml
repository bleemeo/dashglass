name: Release

# Manually triggered release. It mints a CalVer tag (YYYY.MM.DD.HHmmss), then
# publishes the cross-compiled binaries (SPA embedded) as a GitHub Release and
# pushes the multi-arch container image to GHCR for that exact tag. Images and
# release binaries are built *only* here — there is no build on push to main.

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/bleemeo/dashglass

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute version
        id: version
        run: echo "version=$(date -u +'%Y.%m.%d.%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

  binaries:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Build the SPA
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter dashglass build
          rm -rf backend/internal/ui/dist
          cp -R apps/dashglass/dist backend/internal/ui/dist

      - name: Cross-compile binaries
        working-directory: backend
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p ../release
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "../release/dashglass-${GOOS}-${GOARCH}${ext}" .
          done

      - name: Checksums
        working-directory: release
        run: sha256sum dashglass-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: release/*

  docker:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # CalVer tags are not SemVer, so tag the image with the raw version.
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
