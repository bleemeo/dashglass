# Example Polaris configuration (pass with -config polaris.yaml).
# Every value is optional and also settable by flag or environment
# variable; precedence is flags > environment > file > defaults.
# ${VAR} references expand from the environment, so secrets never live
# in this file. See DESIGN.md §7.4.

listen: ":8080"

prometheus:
  url: ${PROMETHEUS_URL}

dashboards:
  dir: ./dashboards
  # Provisioned mode: dashboards are managed by git only, the API
  # refuses writes (wins over any user role).
  readonly: false

grafana_com:
  # Disable the only outbound internet call (marketplace import) for
  # air-gapped installs.
  disable: false

auth:
  # Server-managed state (local users, session secret). Created on first
  # use; never edit by hand. Manage users from the admin UI, or the
  # `polaris user` CLI. Authentication turns on as soon as one user
  # exists — until then everyone is an anonymous admin so you can create
  # the first account from the UI.
  file: ./auth.yaml

  # Trusted reverse-proxy authentication. When user_header is set, an
  # authenticating proxy in front (Authelia, Authentik, oauth2-proxy,
  # Tailscale…) is the identity source and local login is disabled.
  # proxy:
  #   user_header: Remote-User
  #   groups_header: Remote-Groups   # optional
  #   # Only honor identity headers from these peers. Leave unset ONLY if
  #   # the backend is never reachable except through the proxy.
  #   trusted_proxies: ["10.0.0.0/8"]
  #   # Groups → role. Highest match wins; "*" = any authenticated user;
  #   # no match = denied (a shared IdP grants nothing until listed here).
  #   role_mapping:
  #     admin: [polaris-admins]
  #     editor: [dev-team]
  #     viewer: ["*"]

  # Native OpenID Connect login (Authentik, Keycloak, Pocket ID, Auth0…).
  # No reverse proxy needed; Polaris runs the authorization-code flow and
  # maps the ID token's groups claim to a role (same rules as above).
  # oidc:
  #   issuer: https://auth.example.com/application/o/polaris/
  #   client_id: polaris
  #   client_secret: ${OIDC_CLIENT_SECRET}
  #   redirect_url: https://polaris.example.com/api/auth/oidc/callback
  #   groups_claim: groups          # optional (default "groups")
  #   role_mapping:
  #     admin: [polaris-admins]
  #     viewer: ["*"]
