<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashglass</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%232a78d6'/%3E%3Cpath d='M8.46 15.54 A5 5 0 1 1 15.54 15.54' stroke='%23fff' stroke-opacity='.4' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M8.46 15.54 A5 5 0 1 1 16.33 9.5' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16.33' cy='9.5' r='1.4' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      // No-flash color mode: apply the stored/OS preference before the app
      // loads. Mirrors packages/ui applyColorMode(); keep the two in sync.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("dashglass-color-mode");
        } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.dataset.theme = dark ? "dark" : "light";
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
